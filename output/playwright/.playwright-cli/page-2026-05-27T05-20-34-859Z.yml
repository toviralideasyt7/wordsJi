            - generic [ref=e197]:
              - heading "How Betweenle Actually Works" [level=2] [ref=e198]
              - paragraph [ref=e199]: Two boundary words appear on screen. You type the word that fits alphabetically between them. No color tiles, no partial credit — right or wrong. The answer pool is common English words, five to eight letters, and the boundaries are real dictionary neighbors of the answer.
              - paragraph [ref=e200]: Today's page gives you clue cards (length, first/last letter, vowel count, repeats) so you can try before revealing. The solver link at the top filters candidates when the gap is wide.
            - generic [ref=e201]:
              - heading "Tips That Actually Help" [level=2] [ref=e202]
              - generic [ref=e203]:
                - generic [ref=e204]:
                  - heading "Look at the shared prefix first" [level=3] [ref=e205]
                  - paragraph [ref=e206]: If both boundaries start with the same three letters, so does the answer. The clue card tells you first and last letter directly — that usually cuts the possibilities to a handful.
                - generic [ref=e207]:
                  - heading "Recognize recurring gaps" [level=3] [ref=e208]
                  - paragraph [ref=e209]: CRANE → CREAM → CREATE shows up a lot. So do patterns around common five-letter words. The more you play, the more you recognize which alphabetical neighborhoods the game favors.
                - generic [ref=e210]:
                  - heading "Think about word endings" [level=3] [ref=e211]
                  - paragraph [ref=e212]: Boundaries often share suffixes. PLAYING and POINTED — the answer probably ends in -ING or -ED and starts with PL or PO. Morphological patterns matter as much as raw alphabetical order.
                - generic [ref=e213]:
                  - heading "Use the solver when the gap is wide" [level=3] [ref=e214]
                  - paragraph [ref=e215]: When boundaries are far apart (DANCE → DRAKE), you need to think through all words starting with D in that range. The solver does this instantly — faster than scrolling a dictionary.
