# .github/workflows/marveldle-daily.yml
# Daily Marveldle answer solve. Upstream releases the new pick around US
# midnight (~04:00-05:00 UTC); the page flips at the 06:02 UTC puzzle-window
# boundary. Triggered by the wordsolverx-daily-dispatch Cloudflare worker,
# which fires marveldle-daily-requested repository_dispatch events: 06:05 UTC
# with mode=today (full constraint solve, three minutes after the flip so the
# solver never races it) and 06:35 UTC with mode=yesterday (the cheap, reliable
# /yesterday endpoint — one call per mode, no solving — backfills the previous
# day's entry so the yesterday page and archive never have gaps). The solve
# itself takes 2-5 minutes, which is why the today page shows its "updating"
# state until the new entry lands.
#
# Fails loudly: if scripts/marveldle-solve.mjs exits non-zero (either mode
# unsolved, upstream blocked, timeout) the job fails and NOTHING is committed
# — the script never writes a partial entry. Commits only when the data file
# actually changed.
#
# Push race (root cause of the recurring "solved but never landed" days,
# e.g. 2026-10-19/21/22): the today-mode solve takes ~10 minutes, and other
# automation (hint refresh, site publishes) commits to main every few
# minutes, so a bare `git push` at the end was rejected as non-fast-forward
# and the solved entry was thrown away. Yesterday mode never hit it (its
# two API calls finish in seconds). The commit step now rebases onto the
# latest main and retries the push instead of losing the solve.

name: Marveldle Daily

on:
  repository_dispatch:
    types:
      - marveldle-daily-requested
  workflow_dispatch:
    inputs:
      mode:
        description: Which solve mode to run
        required: false
        default: today
        type: choice
        options:
          - today
          - yesterday

permissions:
  contents: write

jobs:
  solve-marveldle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The solve mode comes from the dispatch payload (today at 06:05,
      # yesterday at 06:35). Manual dispatch can override with the `mode` input.
      SOLVE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || github.event.client_payload.mode || 'today' }}
    steps:
      - name: Call video repo (start today's marveldle video)
        env:
          GIT_VIDEO: ${{ secrets.GIT_VIDEO }}
        run: |
          # Two-way trigger (2026-10-23): at the very beginning of this
          # update, ask satwiksamanta77/daily-games to make today's marveldle
          # video. A video already made is skipped by that repo's
          # skip-guard, and when the video run finishes it dispatches
          # "pages-publish-requested" back to this repo, so the rebuild
          # after this update carries the fresh video in the same cycle.
          # This call must never fail the update: any non-204 is logged
          # loudly below and the update continues without the video call.
          if [ "${SOLVE_MODE}" != "today" ]; then
            echo "Solve mode is '${SOLVE_MODE}' - the video call only applies to today's board; skipping it."
            exit 0
          fi
          status=$(curl -sS -o /tmp/video-dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIT_VIDEO}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/satwiksamanta77/daily-games/actions/workflows/daily-all-videos.yml/dispatches \
            -d '{"ref":"main","inputs":{"game":"marveldle","date":"","force":"false","publish":"true"}}') || status="curl-error"
          echo "daily-games video dispatch HTTP status: ${status} (204 = video run started)"
          if [ -s /tmp/video-dispatch-response.txt ]; then
            echo "Response body:"
            cat /tmp/video-dispatch-response.txt
          fi
          case "${status}" in
            204)
              echo "Video run requested for marveldle."
              ;;
            401|403|404)
              echo "::error::GIT_VIDEO cannot dispatch satwiksamanta77/daily-games (HTTP ${status}) - the token lacks Actions write access there. Continuing without the video call."
              ;;
            *)
              echo "::warning::Video dispatch was not accepted (HTTP ${status}). Continuing without the video call."
              ;;
          esac
          exit 0

      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Solve Marveldle answers
        run: node scripts/marveldle-solve.mjs "$SOLVE_MODE"

      - name: Commit and push if data changed
        run: |
          set -e
          if git diff --quiet -- src/lib/data/marveldle-answers.json; then
            echo "Marveldle data unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/marveldle-answers.json
          git commit -m "chore(marveldle): daily answer update $(date -u +%F) [mode: $SOLVE_MODE]"
          # Rebase-and-retry: main moves every few minutes (hint refresh,
          # site publishes) and the solve above takes ~10 minutes, so a
          # bare push loses the race and discards the solved entry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push the Marveldle update after 5 attempts."
          exit 1
