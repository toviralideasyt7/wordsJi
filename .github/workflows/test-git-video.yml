name: Test GIT_VIDEO dispatch (one-off)

# ONE-OFF live test for the two-way trigger (2026-10-23): proves that
# secrets.GIT_VIDEO in this repo can dispatch a workflow in
# satwiksamanta77/daily-games. Dispatches daily-all-videos for nerdle
# with publish=false (gate OFF - nothing can be published by this test).
# This file is deleted immediately after the test run.

on:
  workflow_dispatch:

jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch daily-games nerdle (publish OFF)
        env:
          GIT_VIDEO: ${{ secrets.GIT_VIDEO }}
        run: |
          status=$(curl -sS -o /tmp/video-dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIT_VIDEO}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/satwiksamanta77/daily-games/actions/workflows/daily-all-videos.yml/dispatches \
            -d '{"ref":"main","inputs":{"game":"nerdle","date":"","force":"false","publish":"false"}}') || status="curl-error"
          echo "TEST daily-games video dispatch HTTP status: ${status} (204 = accepted)"
          if [ -s /tmp/video-dispatch-response.txt ]; then
            echo "Response body:"
            cat /tmp/video-dispatch-response.txt
          fi
          exit 0
