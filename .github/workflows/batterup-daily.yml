# .github/workflows/batterup-daily.yml
# Daily Batter Up answer fetch. Upstream data for date D lands on the CDN at
# ~00:32 UTC on D and the page flips at the 01:00 UTC puzzle-window boundary.
# Triggered by the wordsolverx-daily-dispatch Cloudflare worker, which fires
# a batterup-daily-requested repository_dispatch at 01:05 UTC — AFTER the
# boundary — because the site prerenders today pages at deploy time: a bake
# before 01:00 would compute yesterday's puzzle date and permanently bake the
# "updating" state until the next deploy. Running after the boundary guarantees
# the baked page carries today's answer.
#
# Fails loudly: if scripts/batterup-daily.mjs exits non-zero (no CDN data,
# player not found, malformed payload) the job fails and NOTHING is
# committed — the today page renders its "updating" state instead of a wrong
# answer. Commits only when the data files actually changed.

name: Batter Up Daily

on:
  repository_dispatch:
    types:
      - batterup-daily-requested
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-batterup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call video repo (start today's batterup video)
        env:
          GIT_VIDEO: ${{ secrets.GIT_VIDEO }}
        run: |
          # Two-way trigger (2026-10-23): at the very beginning of this
          # update, ask satwiksamanta77/daily-games to make today's batterup
          # video. A video already made is skipped by that repo's
          # skip-guard, and when the video run finishes it dispatches
          # "pages-publish-requested" back to this repo, so the rebuild
          # after this update carries the fresh video in the same cycle.
          # This call must never fail the update: any non-204 is logged
          # loudly below and the update continues without the video call.
          status=$(curl -sS -o /tmp/video-dispatch-response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIT_VIDEO}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/satwiksamanta77/daily-games/actions/workflows/daily-all-videos.yml/dispatches \
            -d '{"ref":"main","inputs":{"game":"batterup","date":"","force":"false","publish":"true"}}') || status="curl-error"
          echo "daily-games video dispatch HTTP status: ${status} (204 = video run started)"
          if [ -s /tmp/video-dispatch-response.txt ]; then
            echo "Response body:"
            cat /tmp/video-dispatch-response.txt
          fi
          case "${status}" in
            204)
              echo "Video run requested for batterup."
              ;;
            401|403|404)
              echo "::error::GIT_VIDEO cannot dispatch satwiksamanta77/daily-games (HTTP ${status}) - the token lacks Actions write access there. Continuing without the video call."
              ;;
            *)
              echo "::warning::Video dispatch was not accepted (HTTP ${status}). Continuing without the video call."
              ;;
          esac
          exit 0

      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch today's Batter Up answer
        run: node scripts/batterup-daily.mjs

      - name: Commit and push if data changed
        run: |
          set -e
          if git diff --quiet -- src/lib/data/batterup-answers.json src/lib/data/batterup-players.json; then
            echo "Batter Up data unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/batterup-answers.json src/lib/data/batterup-players.json
          git commit -m "chore(batterup): daily answer update $(date -u +%F)"
          git push
