<!doctype html>
<html lang="en">

<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
        <style>
                html {
                        background: #ffffff;
                }

                body {
                        margin: 0;
                        min-height: 100vh;
                        background: #ffffff;
                        color: #0f172a;
                        font-family:
                                'Plus Jakarta Sans',
                                'Segoe UI',
                                system-ui,
                                -apple-system,
                                BlinkMacSystemFont,
                                'Helvetica Neue',
                                sans-serif;
                        -webkit-font-smoothing: antialiased;
                        -moz-osx-font-smoothing: grayscale;
                }

                a {
                        color: inherit;
                        text-decoration: none;
                }

                img {
                        display: block;
                        max-width: 100%;
                        height: auto;
                }

                .site-shell {
                        min-height: 100vh;
                        display: flex;
                        flex-direction: column;
                        background: #ffffff;
                }

                .site-main {
                        flex: 1 1 auto;
                }

                body[data-theme='dark'],
                [data-theme='dark'] .site-shell {
                        background: #0f172a;
                        color: #f8fafc;
                }

                #cookie-settings-static {
                        position: fixed;
                        bottom: 0.75rem;
                        left: 50%;
                        transform: translateX(-50%);
                        width: calc(100% - 1.5rem);
                        max-width: 30rem;
                        z-index: 70;
                        display: none;
                        border: 1px solid #e2e8f0;
                        border-radius: 1rem;
                        background: rgba(255, 255, 255, 0.98);
                        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.18);
                        backdrop-filter: blur(12px);
                        -webkit-backdrop-filter: blur(12px);
                }

                html[data-consent-pending='true'] #cookie-settings-static {
                        display: block;
                }

                .cookie-settings-inner {
                        margin: 0 auto;
                        display: flex;
                        max-width: 30rem;
                        flex-direction: column;
                        gap: 0.625rem;
                        padding: 0.875rem 1rem;
                }

                .cookie-settings-copy {
                        max-width: 100%;
                }

                .cookie-settings-eyebrow {
                        margin: 0;
                        font-size: 0.6875rem;
                        font-weight: 600;
                        letter-spacing: 0.16em;
                        text-transform: uppercase;
                        color: #0d9488;
                }

                .cookie-settings-title {
                        margin: 0.125rem 0 0;
                        font-size: 0.9375rem;
                        font-weight: 700;
                        color: #0f172a;
                }

                .cookie-settings-body {
                        margin: 0.25rem 0 0;
                        font-size: 0.8125rem;
                        line-height: 1.55;
                        color: #475569;
                }

                .cookie-settings-body a {
                        font-weight: 600;
                        color: #0d9488;
                }

                .cookie-settings-actions {
                        display: flex;
                        flex-direction: row;
                        gap: 0.5rem;
                }

                .cookie-settings-button {
                        cursor: pointer;
                        border-radius: 0.625rem;
                        padding: 0.5rem 0.875rem;
                        font: inherit;
                        font-size: 0.8125rem;
                        font-weight: 600;
                        flex: 1 1 0;
                        transition:
                                background-color 0.2s ease,
                                border-color 0.2s ease,
                                color 0.2s ease;
                }

                .cookie-settings-button.secondary {
                        border: 1px solid #cbd5e1;
                        background: #ffffff;
                        color: #334155;
                }

                .cookie-settings-button.secondary:hover {
                        border-color: #94a3b8;
                        background: #f8fafc;
                }

                .cookie-settings-button.primary {
                        border: 1px solid #0d9488;
                        background: #0d9488;
                        color: #ffffff;
                }

                .cookie-settings-button.primary:hover {
                        background: #14b8a6;
                        border-color: #14b8a6;
                }

                body[data-theme='dark'] #cookie-settings-static {
                        border-color: #334155;
                        background: rgba(15, 23, 42, 0.98);
                }

                body[data-theme='dark'] .cookie-settings-title {
                        color: #f8fafc;
                }

                body[data-theme='dark'] .cookie-settings-body {
                        color: #cbd5e1;
                }

                body[data-theme='dark'] .cookie-settings-button.secondary {
                        border-color: #475569;
                        background: #0f172a;
                        color: #e2e8f0;
                }

                body[data-theme='dark'] .cookie-settings-button.secondary:hover {
                        background: #1e293b;
                }

                @media (min-width: 640px) {
                        .cookie-settings-inner {
                                padding: 1rem 1.25rem;
                        }
                }
        </style>
        <script>
                (function () {
                        var GA_ID = 'G-8QRMXK049Z';
                        var ADSENSE_SRC = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8421191784631095';
                        var CONSENT_KEY = 'wordsolverx-consent-v1';

                        window.dataLayer = window.dataLayer || [];
                        window.__wordsolverxQueuedGtagCalls = window.__wordsolverxQueuedGtagCalls || [];

                        function readConsent() {
                                try {
                                        var value = window.localStorage.getItem(CONSENT_KEY);
                                        return value === 'accepted' || value === 'rejected' ? value : null;
                                } catch (error) {
                                        return null;
                                }
                        }

                        function setConsentBannerVisibility(visible) {
                                if (visible) {
                                        document.documentElement.setAttribute('data-consent-pending', 'true');
                                } else {
                                        document.documentElement.removeAttribute('data-consent-pending');
                                }
                        }

                        function dispatchConsent(value) {
                                window.dispatchEvent(
                                        new CustomEvent('wordsolverx:consent-updated', {
                                                detail: { value: value }
                                        })
                                );
                        }

                        function queueGtagCall() {
                                var args = Array.prototype.slice.call(arguments);
                                window.__wordsolverxQueuedGtagCalls.push(args);
                        }

                        window.gtag = window.gtag || queueGtagCall;

                        function sendPageView() {
                                if (!window.gtag) return;
                                window.gtag('event', 'page_view', {
                                        page_path: window.location.pathname + window.location.search,
                                        page_location: window.location.href,
                                        page_title: document.title
                                });
                        }

                        function flushQueuedCalls() {
                                var queue = window.__wordsolverxQueuedGtagCalls || [];
                                var hadQueuedPageView = false;

                                window.__wordsolverxQueuedGtagCalls = [];
                                for (var i = 0; i < queue.length; i += 1) {
                                        var args = queue[i];
                                        if (args[0] === 'event' && args[1] === 'page_view') {
                                                hadQueuedPageView = true;
                                        }
                                        window.gtag.apply(window, args);
                                }

                                if (!hadQueuedPageView) {
                                        sendPageView();
                                }

                        function loadAnalytics() {
                                if (window.__wordsolverxAnalyticsLoaded) return;
                                window.__wordsolverxAnalyticsLoaded = true;

                                var script = document.createElement('script');
                                script.async = true;
                                script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;

                                        window.gtag('js', new Date());
                                        window.gtag('config', GA_ID, { send_page_view: false });
                                        flushQueuedCalls();
                                };
                                document.head.appendChild(script);
                        }

                        function loadAdsense() {
                                if (window.__wordsolverxAdsenseLoaded) return;
                                window.__wordsolverxAdsenseLoaded = true;

                                var script = document.createElement('script');
                                script.async = true;
                                script.src = ADSENSE_SRC;
                                script.crossOrigin = 'anonymous';
                                document.head.appendChild(script);
                        }

                        function scheduleAdsense() {
                                if (window.__wordsolverxAdsenseLoaded || window.__wordsolverxAdsenseScheduled) return;
                                window.__wordsolverxAdsenseScheduled = true;

                                var interactionEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
                                var cleanup = function () {
                                        for (var i = 0; i < interactionEvents.length; i += 1) {
                                                window.removeEventListener(interactionEvents[i], loadAfterInteraction);
                                        }

                                        cleanup();
                                        loadAdsense();
                                };

                                        var run = function () {
                                                cleanup();
                                                loadAdsense();

                                                window.requestIdleCallback(run, { timeout: 3000 });
                                                return;
                                        }

                                        window.setTimeout(run, 3000);
                                };

                                for (var i = 0; i < interactionEvents.length; i += 1) {
                                        window.addEventListener(interactionEvents[i], loadAfterInteraction, {
                                                once: true,
                                                passive: true

                                }

                                if (document.readyState === 'complete') {
                                        loadAfterWindowSettles();
                                } else {
                                        window.addEventListener('load', loadAfterWindowSettles, { once: true });
                                }
                        }

                        window.__wordsolverxLoadAnalytics = loadAnalytics;
                        window.__wordsolverxGetConsent = readConsent;
                        window.__wordsolverxSetConsent = function (value) {
                                try {
                                        window.localStorage.setItem(CONSENT_KEY, value);
                                } catch (error) {
                                        // Ignore storage failures and still apply in-memory behavior.
                                }

                                dispatchConsent(value);
                                setConsentBannerVisibility(false);

                                if (value === 'accepted') {
                                        loadAnalytics();
                                        scheduleAdsense();
                                }
                        };

                        function scheduleAnalytics() {
                                var interactionEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
                                var cleanup = function () {
                                        for (var i = 0; i < interactionEvents.length; i += 1) {
                                                window.removeEventListener(interactionEvents[i], loadAfterInteraction);
                                        }
                                };
                                var loadAfterInteraction = function () {
                                        cleanup();
                                        loadAnalytics();
                                };

                                for (var i = 0; i < interactionEvents.length; i += 1) {
                                        window.addEventListener(interactionEvents[i], loadAfterInteraction, {
                                                once: true,
                                                passive: true
                                        });
                                }

                                window.addEventListener(
                                        'load',
                                        function () {
                                                window.setTimeout(function () {
                                                        cleanup();
                                                        loadAnalytics();
                                                }, 15000);
                                        },
                                        { once: true }
                                );
                        }

                        var initialConsent = readConsent();
                        setConsentBannerVisibility(initialConsent === null);

                        if (initialConsent === 'accepted') {
                                scheduleAnalytics();
                                scheduleAdsense();
                        }

                        function updateCardFilter(input) {
                                var group = input.getAttribute('data-card-filter-input');
                                if (!group) return;

                                var query = input.value.trim().toLowerCase();
                                var items = document.querySelectorAll('[data-card-filter-item="' + group + '"]');
                                var visibleBySection = {};

                                items.forEach(function (item) {
                                        var haystack = (item.getAttribute('data-search-text') || '').toLowerCase();
                                        var section = item.getAttribute('data-filter-section') || '';
                                        var isVisible = !query || haystack.indexOf(query) !== -1;
                                        item.hidden = !isVisible;
                                        if (isVisible) {
                                                visibleBySection[section] = true;
                                        }
                                });

                                document
                                        .querySelectorAll('[data-card-filter-empty="' + group + '"]')
                                        .forEach(function (emptyState) {
                                                var section = emptyState.getAttribute('data-empty-scope') || '';
                                                emptyState.hidden = !query || Boolean(visibleBySection[section]);
                                        });
                        }

                        function refreshAllCardFilters() {
                                document.querySelectorAll('[data-card-filter-input]').forEach(function (input) {
                                        updateCardFilter(input);
                                });
                        }

                        document.addEventListener('input', function (event) {
                                var target = event.target;
                                if (target && target.matches && target.matches('[data-card-filter-input]')) {
                                        updateCardFilter(target);
                                }
                        });

                        document.addEventListener('submit', function (event) {
                                var target = event.target;
                                if (target && target.matches && target.matches('[data-card-filter-form]')) {
                                        event.preventDefault();
                                }
                        });

                        document.addEventListener('click', function (event) {
                                var target = event.target;
                                if (!target || !target.closest) return;

                                var consentButton = target.closest('[data-consent-choice]');
                                if (consentButton) {
                                        var consentValue = consentButton.getAttribute('data-consent-choice');
                                        if (consentValue === 'accepted' || consentValue === 'rejected') {
                                                window.__wordsolverxSetConsent(consentValue);
                                        }
                                        return;
                                }

                                var copyButton = target.closest('[data-copy-value]');
                                if (copyButton) {
                                        var textToCopy = copyButton.getAttribute('data-copy-value') || '';
                                        if (!textToCopy || !navigator.clipboard || !navigator.clipboard.writeText) return;

                                        var defaultLabel = copyButton.getAttribute('data-copy-default') || 'Copy';
                                        var successLabel = copyButton.getAttribute('data-copy-success') || 'Copied';

                                        navigator.clipboard.writeText(textToCopy).then(function () {
                                                copyButton.textContent = successLabel;
                                                window.setTimeout(function () {
                                                        copyButton.textContent = defaultLabel;
                                                }, 2000);
                                        });
                                        return;
                                }

                                var reloadButton = target.closest('[data-reload-page]');
                                if (reloadButton) {
                                        window.location.reload();
                                }
                        });

                        if (document.readyState === 'loading') {
                                document.addEventListener('DOMContentLoaded', refreshAllCardFilters, { once: true });
                        } else {
                                refreshAllCardFilters();
                        }

                        window.addEventListener('wordsolverx:consent-open', function () {
                                setConsentBannerVisibility(true);
                        });

                        window.addEventListener('wordsolverx:consent-updated', function (event) {
                                var nextValue =
                                        event && event.detail && event.detail.value !== undefined
                                                ? event.detail.value
                                                : readConsent();
                                setConsentBannerVisibility(nextValue !== 'accepted' && nextValue !== 'rejected');
                        });

                        window.addEventListener('pageshow', refreshAllCardFilters);
                })();
        </script>

<body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
        <section id="cookie-settings-static" aria-label="Cookie consent">
                <div class="cookie-settings-inner">
                        <div class="cookie-settings-copy">
                                <p class="cookie-settings-eyebrow">Privacy choices</p>
                                <h2 class="cookie-settings-title">Cookies &amp; ads</h2>
                                <p class="cookie-settings-body">
                                        We use storage for site preferences plus optional analytics and ads. Accept
                                        enables Google Analytics &amp; AdSense; reject keeps browsing only. See our
                                        <a href="/privacy-policy">Privacy Policy</a>.
                                </p>
                        </div>
                        <div class="cookie-settings-actions">
                                <button
                                        type="button"
                                        class="cookie-settings-button secondary"
                                        data-consent-choice="rejected"
                                >
                                        Reject
                                </button>
                                <button
                                        type="button"
                                        class="cookie-settings-button primary"
                                        data-consent-choice="accepted"
                                >
                                        Accept
                                </button>
                        </div>
                </div>
        </section>
</body>
