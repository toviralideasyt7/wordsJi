          - heading "What you're looking at today" [level=2] [ref=e158]
          - paragraph [ref=e159]: Framed shows you one movie frame per guess. You get six tries to name the film. The first frame is usually vague — a color palette, a silhouette, a location you might not recognize. By frame three or four, most people who watch movies regularly can narrow it down.
          - paragraph [ref=e160]: "There are four variants running daily: Classic (six progressive frames), One Frame (one shot only), Titleshot (title screen or poster text), and Poster (movie poster). Each picks a different movie, so you get four separate challenges every day. The answer cards above show today's picks across all four."
        - generic [ref=e161]:
          - heading "How to read the frames" [level=2] [ref=e162]
          - paragraph [ref=e163]: Genre recognition matters more than specific film knowledge early on. Color grading, aspect ratio, and lighting style tell you the era — desaturated cool tones usually mean 2000s thriller or drama, warm wide shots suggest a blockbuster or western. If you can pin the decade from the first frame, you've already cut the answer pool by two-thirds.
          - paragraph [ref=e164]: Don't guess on the first frame. Wait until frame two or three, when you can spot an actor's face, a recognizable prop, or a distinctive location. Burning a guess on a vague opening shot wastes one of your six attempts for almost no payoff. Props and wardrobe are underrated — a lightsaber, a yellow taxi, a specific uniform can nail the answer before you even recognize the actors.
        - generic [ref=e165]:
          - heading "Common wrong approaches" [level=2] [ref=e166]
          - paragraph [ref=e167]: The biggest mistake is guessing obscure films. Framed picks widely known movies — Oscar nominees, top-grossers, cult favorites with big audiences. If your first thought is an arthouse film from 1973, it's almost certainly wrong. Stick to movies you've heard of, even if you haven't seen them.
          - paragraph [ref=e168]: The second mistake is ignoring the archive. Browsing a week of past answers teaches you which decades and genres the game favors. It also shows you which movies appeared recently — the game rarely repeats within a month, so you can eliminate recent answers from your shortlist.
