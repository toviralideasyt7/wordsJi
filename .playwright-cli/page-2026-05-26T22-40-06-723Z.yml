        - paragraph [ref=e137]: "Today's Colordle answer is Velvet, a deep pink hex #750851. It follows a streak of cool tones, making it a sharp pivot for guessers."
        - generic [ref=e138]:
          - heading "Today's Colordle answer at a glance" [level=2] [ref=e139]
          - paragraph [ref=e140]: The answer for May 27, 2026 (Day 1524) is Velvet.
          - paragraph [ref=e141]: "This deep, saturated shade carries the hex code #750851 and belongs to the pink hue family."
          - paragraph [ref=e142]: It marks a distinct shift from the cool, grey-blue tones of the previous four days.
          - paragraph [ref=e143]: Players should expect a puzzle that demands a move away from neutrals and into rich, dark saturation.
          - paragraph [ref=e144]: Velvet is not a light pastel. It is a heavy, dark pink with significant blue undertones.
          - paragraph [ref=e145]: If your first guess lands on a bright or washed-out pink, the feedback will likely show a mismatch in both lightness and saturation.
          - paragraph [ref=e146]: The key to solving this quickly is recognizing that the color leans heavily toward the violet end of the spectrum while remaining firmly in the pink category.
          - heading "What kind of color this is" [level=2] [ref=e147]
          - paragraph [ref=e148]: Velvet (#750851) is a dark, rich pink that reads almost purple in low light.
          - paragraph [ref=e149]: It sits deep in the hue wheel, balancing red and blue components with a very low green value.
          - paragraph [ref=e150]: This specific hex code creates a color that feels heavy and luxurious, distinct from the lighter, airier pinks often found in daily puzzles.
          - paragraph [ref=e151]: Comparing it to recent history highlights its uniqueness. Yesterday's Cadet (#536872) was a muted, cool grey.
          - paragraph [ref=e152]: The day before, Celeste (#B2FFFF) was a bright, icy cyan. Velvet breaks that cool streak entirely.
          - paragraph [ref=e153]: It introduces warmth and depth that previous guesses likely ignored. Players who stick to the cool palette will struggle to find the right hue.
          - heading "How to narrow your guesses toward it" [level=2] [ref=e154]
          - paragraph [ref=e155]: Start by eliminating the cool greys and cyans that dominated the last week.
          - paragraph [ref=e156]: A guess like Cadet or Storm will yield poor feedback on the hue wheel. Instead, pivot immediately to the red-blue axis.
          - paragraph [ref=e157]: Try a deep magenta or a dark plum to test the saturation levels.
          - paragraph [ref=e158]: "Focus on the lightness value. #750851 is significantly darker than Celeste but not as black as Storm."
          - paragraph [ref=e159]: A good mid-range guess would be a deep rose or a dark fuchsia. If the game indicates your guess is too light, darken it.
          - paragraph [ref=e160]: If it says the hue is off, adjust the red-to-blue ratio rather than the brightness.
          - heading "Where players usually go wrong" [level=2] [ref=e161]
          - paragraph [ref=e162]: The most common mistake is guessing a bright, hot pink. Velvet is dark and muted, not neon.
          - paragraph [ref=e163]: Players often assume "pink" means a light, cheerful shade and waste turns on colors like Hot Pink or Bubblegum.
          - paragraph [ref=e164]: These guesses will fail on the lightness metric alone.
          - paragraph [ref=e165]: Another trap is confusing pink with purple. While Velvet has blue in it, it is not a true purple.
          - paragraph [ref=e166]: Guesses like Indigo or Royal Purple will often land close in hue but fail to register as the correct family.
          - paragraph [ref=e167]: The distinction lies in the specific ratio of red to blue, which favors red just enough to stay in the pink category.
          - heading "How the score logic actually helps" [level=2] [ref=e168]
          - paragraph [ref=e169]: The feedback system rewards precision in saturation.
          - paragraph [ref=e170]: Because Velvet is so deep, a guess that is too pale will show a large gap in the lightness score.
          - paragraph [ref=e171]: Use this to your advantage. If a guess is too light, the next one must be significantly darker, not just a different hue.
          - paragraph [ref=e172]: Look at the hue wheel feedback.
          - paragraph [ref=e173]: If a guess lands in the red zone but is too far from the target, the wheel will show a directional arrow.
          - paragraph [ref=e174]: This tells you whether to add more blue or more red.
          - paragraph [ref=e175]: For Velvet, you are looking for a point where the red is dominant but the blue pulls it down into darkness.
          - heading "Questions players keep asking" [level=2] [ref=e176]
          - heading "Is Velvet considered a purple or pink?" [level=3] [ref=e177]
          - paragraph [ref=e178]: It is classified as pink, but it sits right on the border with purple.
          - paragraph [ref=e179]: "The hex code #750851 has a higher red component than blue, which keeps it in the pink family despite the deep, violet-like appearance."
          - heading "Why did the color change so drastically from yesterday?" [level=3] [ref=e180]
          - paragraph [ref=e181]: Colordle cycles through various palettes. After four days of cool, desaturated tones (Storm, Evergreen, Celeste, Cadet), the algorithm introduced a warm, saturated color.
          - paragraph [ref=e182]: This is a deliberate design choice to test a player's ability to pivot quickly.
          - heading "What hex codes are close to Velvet?" [level=3] [ref=e183]
          - paragraph [ref=e184]: "Colors like #660033 (Dark Purple) or #800040 (Dark Rose) are close neighbors."
          - paragraph [ref=e185]: "However, Velvet's specific balance of #75 red and #51 blue makes it unique. Small shifts in these values create distinctly different colors."
          - heading "Can I solve this without knowing hex codes?" [level=3] [ref=e186]
          - paragraph [ref=e187]: Yes. Focus on the visual feedback.
          - paragraph [ref=e188]: If your guess is too light, darken it. If it's too green, remove the green.
          - paragraph [ref=e189]: If it's too red, add blue. The color wheel feedback is designed to guide you without needing to memorize hex values.
