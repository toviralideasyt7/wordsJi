            - 'heading "11-letter Wordle: the ultimate test" [level=2] [ref=e197]'
            - generic [ref=e198]:
              - paragraph [ref=e199]: The 11-letter answer pool has roughly 12,000 words. The solver is completely essential here. No one tracks eleven-position elimination across 12,000 words mentally — it is not possible.
              - paragraph [ref=e200]: Eleven tiles means one green tells you 1/11 of the answer and eliminates ~91% of candidates for that position. But getting that green requires navigating 12,000 vocabulary options.
              - paragraph [ref=e201]: Hard mode at 11 letters is the hardest standard Wordle format. Eleven simultaneous locks severely restrict valid candidates.
          - generic [ref=e202]:
            - 'heading "The huge pool: ~12,000 words" [level=2] [ref=e203]'
            - generic [ref=e204]:
              - paragraph [ref=e205]: 12,000 words in the 11-letter pool is beyond what any human can track. After two guesses, you could have 2,000+ viable candidates — completely manual solving is impossible.
              - paragraph [ref=e206]: The solver cross-references all eleven tiles of feedback against the full 12,000-word pool in milliseconds. You enter clues, it shows all valid candidates that satisfy them.
              - paragraph [ref=e207]: Without the solver, 11-letter Wordle cannot be solved systematically. The solver is not helpful — it is the only way to make progress.
          - generic [ref=e208]:
            - heading "Starting word strategy at 11 letters" [level=2] [ref=e209]
            - generic [ref=e210]:
              - paragraph [ref=e211]: ABORTIONIZE, CHRONOLOGIES, and INTERNATION are strong 11-letter starters. These maximize letter diversity across all eleven positions with no duplicates.
              - paragraph [ref=e212]: Rare letters like Q, X, Z, J should be avoided in openers unless you have confirmed clue support. They appear in fewer than 1% of 11-letter answers and waste positions.
              - paragraph [ref=e213]: The solver ranks starting candidates by letter frequency within the 11-letter pool specifically. The patterns at 11 letters differ from shorter lengths.
          - generic [ref=e214]:
            - 'heading "Hard mode at 11 letters: the hardest Wordle format" [level=2] [ref=e215]'
            - generic [ref=e216]:
              - paragraph [ref=e217]: Eleven simultaneous locks must all be satisfied in every guess. This is the hardest standard Wordle format. As you lock in letters, valid candidates become vanishingly rare.
              - paragraph [ref=e218]: The solver finds 11-letter words from the 12,000-word pool that satisfy all eleven locks. It ensures every suggestion respects your hard mode constraints.
              - paragraph [ref=e219]: Without the solver, finding valid hard mode candidates at 11 letters after four confirmed clues is essentially impossible. The constraint intersection is too tight.
          - generic [ref=e220]:
            - heading "The information equation at 11 letters" [level=2] [ref=e221]
            - generic [ref=e222]:
              - paragraph [ref=e223]: One green at 11 letters narrows 1/11 of the answer and eliminates ~91% of candidates for that position. That is the most constraint power per confirmed letter of any standard Wordle length.
              - paragraph [ref=e224]: Two greens typically narrows to under 30 candidates. Three greens usually leaves fewer than 5. The solver sorts these final candidates by likelihood.
              - paragraph [ref=e225]: The solver handles the complex cross-referencing. You enter eleven tiles of feedback, it shows all 12,000-word pool candidates that satisfy the full constraint set.
          - generic [ref=e226]:
            - heading "Vocabulary in the 11-letter pool" [level=2] [ref=e227]
            - generic [ref=e228]:
              - paragraph [ref=e229]: "The 11-letter pool is dominated by long Latin and Greek formations: INTERNATIONALIZATION, UNCHARACTERISTIC, COMPREHENSIVE. These are not everyday vocabulary."
              - paragraph [ref=e230]: Legal, medical, scientific, and compound vocabulary dominates. Without the solver, you waste guesses on valid English words that are not in the accepted answer list.
              - paragraph [ref=e231]: The solver filters to only accepted 11-letter answers. It shows candidates that are both valid and consistent with your clues, sorted by how well they match the clue pattern.
          - generic [ref=e232]:
            - heading "How the solver works at 11 letters" [level=2] [ref=e233]
            - generic [ref=e234]:
              - paragraph [ref=e235]: The solver cross-references all eleven tiles of feedback against 12,000 words instantly. You enter your clues, it shows candidates satisfying all eleven constraints simultaneously.
              - paragraph [ref=e236]: At this length, you must use the solver from the beginning. Manual solving cannot keep up after the first guess — the candidate pool is too large to track mentally.
              - paragraph [ref=e237]: The solver also prevents guessing non-answers. When you are down to candidates and cannot distinguish them, the solver shows which fits all clues best.
          - generic [ref=e238]:
            - heading "Strategy for 11-letter Wordle" [level=2] [ref=e239]
            - generic [ref=e240]:
              - paragraph [ref=e241]: Use the solver from the very first guess. There is no manual alternative at this length. Let the solver show you candidates as you build up clue information.
              - paragraph [ref=e242]: Maximize letter diversity in your opener. ABORTIONIZE or CHRONOLOGIES covers eleven distinct positions with common letters — no duplicates, maximum information.
