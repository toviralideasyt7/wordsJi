        - generic [ref=e102]:
          - paragraph [ref=e103]: Today's notes
          - paragraph [ref=e104]: Updated 2026-05-27
          - heading "Worldle Answer Today — May 27, 2026" [level=2] [ref=e106]
          - paragraph [ref=e107]: Today's Worldle puzzle features a country silhouette with directional distance hints. Learn how to read the clues and avoid common guessing mistakes.
          - generic [ref=e108]:
            - paragraph [ref=e109]: The board's showing a recognizable shape today—coastline curves that narrow toward one end, land borders that suggest neighbors on multiple sides.
            - paragraph [ref=e110]: No name revealed yet. That's where the solver comes in.
            - heading "Where in the world is today's answer?" [level=2] [ref=e111]
            - paragraph [ref=e112]: Worldle drops you straight into a single silhouette. No continent label.
            - paragraph [ref=e113]: No grid of options. Just shape and shadow against a blank background.
            - paragraph [ref=e114]: The first guess isn't about knowing every country—it's about recognizing which region fits the outline's proportions.
            - paragraph [ref=e115]: Today's shape has that distinctive elongated profile. Narrow at one tip, wider through the middle.
            - paragraph [ref=e116]: That rules out compact nations immediately. If your first guess lands somewhere in the wrong hemisphere, the distance percentage will tell you fast.
            - paragraph [ref=e117]: A reading above 8,000 km means you've guessed entirely wrong. Below 500 km means you're close enough to smell it.
            - paragraph [ref=e118]: The archive lookup on this page lets you cross-reference past reveals.
            - paragraph [ref=e119]: Some solvers use it to track patterns—certain countries show up more frequently than others over rolling 30-day windows.
            - heading "Reading the directional clues" [level=2] [ref=e120]
            - paragraph [ref=e121]: "After each guess, Worldle gives you two things: a distance number and an arrow pointing roughly where the answer sits relative to your guess."
            - paragraph [ref=e122]: These aren't decorative. Together they triangulate position.
            - paragraph [ref=e123]: The arrow tells you general direction. Combine that with the distance figure.
            - paragraph [ref=e124]: If you guess Brazil and get an arrow pointing northeast with 12,000 km, the answer isn't in South America—Brazil covers most of that subcontinent.
            - paragraph [ref=e125]: You'd be looking at West Africa or somewhere in the Mediterranean instead.
            - paragraph [ref=e126]: Distance measurements follow geodesic math, so they're accurate to real-world geography.
            - paragraph [ref=e127]: A guess of Spain returning 600 km could mean Portugal, Morocco, or France—depending on which way the arrow points.
            - paragraph [ref=e128]: That's three completely different answers from one data point.
            - paragraph [ref=e129]: "Pro tip: use your second guess to eliminate entire continents. If Spain gets you 600 km northwest, the answer might be Ireland."
            - paragraph [ref=e130]: But if Argentina gets you 9,000 km southeast, you've confirmed it's not in Europe. One wrong continent guess narrows the field dramatically.
            - heading "Mistakes that waste guesses" [level=2] [ref=e131]
            - paragraph [ref=e132]: Starting with obvious large countries wastes information. Guessing Russia first tells you almost nothing—it spans twelve time zones and borders fourteen countries.
            - paragraph [ref=e133]: You'll get a small distance number from almost anywhere. Instead, start with medium-sized nations in different regions.
            - paragraph [ref=e134]: Compare the results.
            - paragraph [ref=e135]: Ignoring the arrow is the second biggest error. Solvers fixate on the distance number and forget direction matters equally.
            - paragraph [ref=e136]: Germany might be 800 km from Italy. So is Austria.
            - paragraph [ref=e137]: So is Switzerland. The arrow tells you which.
            - paragraph [ref=e138]: "Third mistake: forgetting island nations."
            - paragraph [ref=e139]: Countries like Indonesia, Japan, Philippines, or New Zealand have distinct shapes but get overlooked because solvers assume the answer must be on a major landmass.
            - paragraph [ref=e140]: Check the silhouette carefully—if it looks isolated or elongated along a coast, consider archipelagos.
            - paragraph [ref=e141]: Finally, some players skip the reveal entirely. Today's answer gets archived automatically.
            - paragraph [ref=e142]: If you solve it, the next day's puzzle doesn't depend on remembering yesterday's shape.
            - paragraph [ref=e143]: But checking the reveal teaches you what the board considered difficult that day.
            - heading "Questions players keep asking" [level=2] [ref=e144]
            - heading "Does Worldle repeat countries?" [level=3] [ref=e145]
            - paragraph [ref=e146]: Yes. The daily puzzle cycles through a set that includes repeats.
            - paragraph [ref=e147]: An archive lookup from last month might show the same country appearing twice within weeks.
            - paragraph [ref=e148]: The algorithm favors variety but doesn't exclude previous answers outright.
            - heading "What's the maximum distance possible?" [level=3] [ref=e149]
            - paragraph [ref=e150]: About 20,000 km—the diameter of Earth.
            - paragraph [ref=e151]: If you guess a country in one hemisphere and the answer sits in the opposite hemisphere, you'll see numbers approaching that ceiling.
            - paragraph [ref=e152]: Anything above 15,000 km usually means you've picked entirely the wrong continent.
            - heading "Do territory shapes ever appear?" [level=3] [ref=e153]
            - paragraph [ref=e154]: No. Worldle uses sovereign nations only.
            - paragraph [ref=e155]: Hawaii won't show up as a separate entry—it's part of the United States.
            - paragraph [ref=e156]: Same applies to French overseas regions, British territories, and similar administrative divisions. The silhouette always represents the internationally recognized country boundary.
            - heading "Can I practice without affecting the streak?" [level=3] [ref=e157]
            - paragraph [ref=e158]: There's no practice mode built into Worldle proper. Some solvers use the archive to review old puzzles without submitting guesses.
            - paragraph [ref=e159]: Others bookmark the solver link to test their geography against historical reveals.
            - paragraph [ref=e160]: Neither approach affects your main streak if you choose not to submit a guess during practice.
            - paragraph [ref=e161]: The silhouette on today's board has enough visual character to solve in four guesses or fewer if you read the directional data correctly.
            - paragraph [ref=e162]: Start broad, triangulate position, then narrow by shape.
            - paragraph [ref=e163]: The archive holds all previous reveals if you want to study how other solvers approached similar outlines.
