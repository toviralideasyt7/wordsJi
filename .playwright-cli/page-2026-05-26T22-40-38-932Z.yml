          - generic [ref=e160]:
            - heading "Why 5-letter is the canonical Wordle length" [level=2] [ref=e161]
            - generic [ref=e162]:
              - paragraph [ref=e163]: 5-letter Wordle has roughly 2,300 accepted answers — the sweet spot between too few options (making it trivial) and too many (making it impossible without a solver).
              - paragraph [ref=e164]: The 2,300-word pool is large enough to require systematic elimination but small enough that good starting words get you most of the way. The solver handles the last mile.
              - paragraph [ref=e165]: This is the format the NYT Wordle uses, which means most strategy content, starting word discussions, and solver tools are optimized for 5 letters.
          - generic [ref=e166]:
            - 'heading "CRANE vs SLATE vs ADIEU: the starting word debate" [level=2] [ref=e167]'
            - generic [ref=e168]:
              - paragraph [ref=e169]: CRANE has been the classic 5-letter starter for years because it hits five common letters (C, R, A, N, E) with good position spread. No letter repeats, no rare consonants.
              - paragraph [ref=e170]: SLATE is a strong alternative with S, L, A, T, E — four common letters and one less common (L). It performs similarly to CRANE in letter frequency analysis.
              - paragraph [ref=e171]: ADIEU is vowel-heavy (A, D, I, E, U — four vowels) which gives you fast vowel information but risks wasting a tile on U if the answer has few vowels. Use it when your variant seems vowel-rich.
          - generic [ref=e172]:
            - heading "Letter frequency patterns at 5 letters" [level=2] [ref=e173]
            - generic [ref=e174]:
              - paragraph [ref=e175]: E, A, R, O, T, L, I, S, N, C, U, are the most common 5-letter letters in roughly that order. Getting a green on E, A, or R is high-value because they appear in the majority of answers.
              - paragraph [ref=e176]: Rare letters like Q, X, Z, and J appear in fewer than 2% of 5-letter answers. Avoid starting with them unless you are guessing based on confirmed clue information.
              - paragraph [ref=e177]: The solver ranks candidates by letter frequency within the 5-letter pool specifically. This means the top suggestion after your first guess is optimized for 5-letter Wordle, not generic English.
          - generic [ref=e178]:
            - 'heading "Duplicate letters at 5 letters: TEETH, PRESS,llama" [level=2] [ref=e179]'
            - generic [ref=e180]:
              - paragraph [ref=e181]: TEETH, PRESS,llama — duplicate letters are surprisingly common at 5 letters. They fool people because you expect five different positions and the mixed feedback (some green, some yellow) seems contradictory.
              - paragraph [ref=e182]: When you guess TEETH and get green-yellow-yellow-gray-gray, it means the first E is in the right position, the second and third E are in the word but wrong positions, and T and H are absent.
              - paragraph [ref=e183]: The solver handles duplicate letter math automatically. When you set feedback for a word with repeated letters, the solver knows to treat each tile independently based on the actual answer pattern.
          - generic [ref=e184]:
            - heading "Why hard mode at 5 letters gets seriously hard" [level=2] [ref=e185]
            - generic [ref=e186]:
              - paragraph [ref=e187]: Hard mode at 5 letters requires satisfying five simultaneous locks — confirmed greens in their exact positions and confirmed yellows somewhere else in the word. One wrong lock can waste multiple guesses.
              - paragraph [ref=e188]: The most common hard mode mistake is locking in a yellow as if it were green. A yellow means the letter is in the word but not in that position. Treating it as locked in the same spot breaks the puzzle.
              - paragraph [ref=e189]: The solver finds valid 5-letter words that satisfy all your hard mode locks. You pick which candidate to play — the solver just ensures it is a real answer that respects your constraints.
          - generic [ref=e190]:
            - heading "The 2,300-word pool and when to use the solver" [level=2] [ref=e191]
            - generic [ref=e192]:
              - paragraph [ref=e193]: With 2,300 answers, you can usually get to the last 10-20 candidates through good starting words and systematic elimination. The solver helps at the tail end when you cannot track the overlapping constraints mentally.
              - paragraph [ref=e194]: Two confirmed letters in the right positions (two greens) typically narrows the pool to under 50 candidates. Three greens narrows to under 10. The solver sorts those final candidates by likelihood.
              - paragraph [ref=e195]: Use the solver when you have two or more confirmed clues and cannot easily find all remaining words that satisfy them.
          - generic [ref=e196]:
            - heading "Strategy pivots in 5-letter Wordle" [level=2] [ref=e197]
            - generic [ref=e198]:
              - paragraph [ref=e199]: "Early game: maximize information. Pick starting words that use common letters in diverse positions. CRANE or SLATE gives you the broadest feedback coverage."
              - paragraph [ref=e200]: "Mid game: eliminate aggressively. Once you have confirmed letters, use the solver to find words that satisfy all constraints. Do not keep guessing randomly — let the elimination algorithm work."
              - paragraph [ref=e201]: "Late game: when you have under 5 candidates, pick the one with the best letter frequency score. The solver ranks by this automatically."
          - generic [ref=e202]:
            - heading "Why 5 letters feels like the sweet spot" [level=2] [ref=e203]
            - generic [ref=e204]:
              - paragraph [ref=e205]: Five tiles is enough to have interesting letter position complexity but few enough that good starting words cover most of the information space. The game feels balanced.
              - paragraph [ref=e206]: The 5-letter answer pool aligns with the natural vocabulary size most English speakers have. You probably know most of the 2,300 answers, which means the game feels fair even when you lose.
              - paragraph [ref=e207]: The solver enhances the experience without breaking it. At 5 letters, you can still solve manually and feel the satisfaction — the solver just helps when you get genuinely stuck.
